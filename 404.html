<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F3F0E9" />
  <title>Page Not Found — Remeet</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Reenie+Beanie&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f3f0e9;--ink:#1e2a22;--olive:#37483a}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(30,42,34,.08)}
    .brand{font-family:"Cormorant Garamond",serif;font-size:2.1rem;font-weight:600;letter-spacing:-.04em;color:var(--ink);text-decoration:none}
    .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
    h1{font-family:"Cormorant Garamond",serif;font-size:clamp(3rem,10vw,5rem);line-height:.9;margin:0 0 16px}
    p{max-width:400px;margin:0 0 24px;color:#5f665f;line-height:1.5}
    .hand{font-family:"Reenie Beanie",cursive;font-size:1.6rem;color:var(--ink);margin-bottom:32px}
    .links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    .links a{padding:12px 28px;border:1px solid var(--ink);border-radius:8px;text-decoration:none;color:var(--ink);font-size:.9rem;transition:all .2s}
    .links a:hover{background:var(--olive);color:#fff;border-color:var(--olive)}
  </style>
</head>
<body>
  <header class="nav"><a class="brand" href="/">Remeet</a></header>
  <div class="content">
    <h1>404</h1>
    <p>This page doesn't exist — but your photo book could.</p>
    <div class="hand">Every story starts somewhere. ♡</div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/#start">Start Your Book</a>
    </div>
  </div>
</body>
</html>
